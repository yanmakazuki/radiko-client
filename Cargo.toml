[package]
name = "radiko-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
chrono = "0.4.45"
serde_json = "1.0.154"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
directories = "6.0"
rpassword = "7.4"
tempfile = "3.23"
zeroize = "1.9"
libc = "0.2"
base64 = "0.22"
quick-xml = { version = "0.38", features = ["serialize"] }
m3u8-rs = "6.0"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "wav", "pcm"] }
getrandom = "0.2"
