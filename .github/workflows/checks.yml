name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, lint, and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ALSA development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Clippy
        run: cargo +stable clippy --workspace --locked --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo +stable test --workspace --locked --all-targets --all-features
      - name: Verification script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: TUI smoke test
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # ubuntu-24.04 may set kernel.apparmor_restrict_unprivileged_userns=1.
          # Relax it only when unprivileged user namespaces are refused, then enter
          # one with unshare -rn. The smoke process is not root on the host.
          if ! unshare -rn true; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            unshare -rn true
          fi
          python3 -c 'import socket; socket.create_connection(("1.1.1.1", 443), timeout=5).close()'
          unshare -rn python3 scripts/smoke_tui.py --require-isolated-network --binary target/debug/radiko-client

  msrv:
    name: Rust 1.85.0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install ALSA development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Rust tests
        run: cargo +1.85.0 test --workspace --locked --all-targets --all-features
