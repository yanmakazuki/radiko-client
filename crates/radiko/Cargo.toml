[package]
name = "radiko"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "番組表、認証、再生、保存を扱う radiko クライアントライブラリ"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono = "0.4.45"
serde_json = "1.0.154"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
directories = "6.0"
tempfile = "3.23"
zeroize = "1.9"
libc = "0.2"
base64 = "0.22"
quick-xml = { version = "0.38", features = ["serialize"] }
m3u8-rs = "6.0"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "wav", "pcm"] }
getrandom = "0.2"
rusty_aac = { version = "=1.1.0", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
cpal = "=0.16.0"
rtrb = "=0.3.2"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[build-dependencies]
cc = "1.2"
