[package]
name = "radiko-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
radiko = { path = "../radiko" }
chrono = "0.4.45"
serde_json = "1.0.154"
zeroize = "1.9"
rpassword = "7.4"
ctrlc = { version = "3.4", features = ["termination"] }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "=0.28.1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
libc = "0.2.190"
tempfile = "3.23"
